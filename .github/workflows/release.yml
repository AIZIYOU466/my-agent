name: Release Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AICODE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/yaagent.jks
          echo "keystore restored ($(stat -c%s app/yaagent.jks) bytes)"

      - name: Generate keystore.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.AICODE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AICODE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.AICODE_KEY_PASSWORD }}
        run: |
          cat > app/keystore.properties <<PROPS
          storeFile=yaagent.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
          echo "keystore.properties generated"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build universal release APK
        run: ./gradlew :app:assembleUniversalRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yaagent-release-apk
          path: app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
